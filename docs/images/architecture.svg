<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .g { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: #64748b; }
      .h { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 12px; fill: #334155; }
      .m { font-size: 11px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lbl { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="619" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" class="title">Architecture: Burp's threads only hand off</text>
  <text x="32" y="68" class="sub">Handlers check the tool and offer a small event to a bounded queue (≈0.2–1 µs). Parsing, diffing, SQLite and UI work run on the extension's own threads.</text>

  <!-- column labels -->
  <text x="32" y="104" class="g">BURP THREADS</text>
  <text x="318" y="104" class="g">QUEUES</text>
  <text x="474" y="104" class="g">EXTENSION THREADS</text>
  <text x="852" y="104" class="g">STORAGE · UI · AI</text>

  <!-- Burp threads -->
  <rect x="32" y="116" width="240" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="46" y="140" class="h">Proxy handler</text>
  <text x="46" y="158" class="t">untested → yellow · x-burp AI tag</text>
  <text x="46" y="174" class="t">(header stripped, never forwarded)</text>

  <rect x="32" y="194" width="240" height="66" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="46" y="218" class="h">HTTP handler</text>
  <text x="46" y="236" class="t">Repeater sends + responses</text>
  <text x="46" y="252" class="t">Intruder responses</text>

  <rect x="32" y="272" width="240" height="66" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="46" y="296" class="h">Context menu · hotkey</text>
  <text x="46" y="314" class="t">Send to Repeater (tracked)</text>
  <text x="46" y="330" class="t">copy log for AI · label value</text>

  <rect x="32" y="350" width="240" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="46" y="372" class="h">Repeater tab hook</text>
  <text x="46" y="390" class="t">names tabs opened with Ctrl+R</text>

  <rect x="32" y="430" width="240" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="46" y="454" class="h" fill="#475569">Burp Proxy history</text>
  <text x="46" y="472" class="t">read in id-filtered passes</text>

  <!-- queues -->
  <g>
    <rect x="318" y="150" width="120" height="74" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="330" y="162" width="18" height="50" rx="3" fill="#cbd5e1"/>
    <rect x="352" y="162" width="18" height="50" rx="3" fill="#cbd5e1"/>
    <rect x="374" y="162" width="18" height="50" rx="3" fill="#e2e8f0"/>
    <rect x="396" y="162" width="18" height="50" rx="3" fill="#f1f5f9"/>
    <text x="318" y="242" class="lbl">events (2,000 max)</text>
  </g>
  <g>
    <rect x="318" y="270" width="120" height="74" rx="8" fill="#ffffff" stroke="#f472b6"/>
    <rect x="330" y="282" width="18" height="50" rx="3" fill="#fbcfe8"/>
    <rect x="352" y="282" width="18" height="50" rx="3" fill="#fbcfe8"/>
    <rect x="374" y="282" width="18" height="50" rx="3" fill="#fce7f3"/>
    <text x="318" y="362" class="lbl">Intruder hits (64 MB)</text>
  </g>

  <!-- extension threads -->
  <rect x="474" y="116" width="330" height="128" rx="10" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="488" y="140" class="h">tracker-core</text>
  <text x="488" y="160" class="t">match request ↔ response · pick the original</text>
  <text x="488" y="178" class="t">(tracked send, tab hook, Proxy lookup, variant)</text>
  <text x="488" y="196" class="t">diff  ~ − +  ·  number entries #1, #2 … per API</text>
  <text x="488" y="214" class="t">mark tested · store original request + response</text>
  <text x="488" y="232" class="t">masked fields → &lt;#fingerprint&gt;, labels → &lt;userA&gt;</text>

  <rect x="474" y="258" width="330" height="86" rx="10" fill="#fdf2f8" stroke="#ec4899"/>
  <text x="488" y="282" class="h">tracker-intruder</text>
  <text x="488" y="302" class="t">group responses into attacks</text>
  <text x="488" y="320" class="t">infer § payload positions (payloads never logged)</text>
  <text x="488" y="336" class="t">one log row per attack, updated while running</text>

  <rect x="474" y="358" width="330" height="128" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="488" y="382" class="h">tracker-history</text>
  <text x="488" y="402" class="t">index Proxy history once (each entry parsed once)</text>
  <text x="488" y="420" class="t">highlight / clear yellow in batches of 200</text>
  <text x="488" y="438" class="t">find the original + its response for a send</text>
  <text x="488" y="456" class="t">untested APIs in the current scope</text>
  <text x="488" y="474" class="t">(scope changes rescan automatically)</text>

  <!-- storage / ui / ai -->
  <rect x="852" y="116" width="316" height="62" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="866" y="140" class="h">tracker-db</text>
  <text x="866" y="160" class="t">single writer · batched transactions</text>

  <!-- cylinder -->
  <g>
    <path d="M880,206 a130,14 0 0 0 260,0 v70 a130,14 0 0 1 -260,0 z" fill="#ecfeff" stroke="#0891b2"/>
    <ellipse cx="1010" cy="206" rx="130" ry="14" fill="#cffafe" stroke="#0891b2"/>
    <text x="1010" y="240" text-anchor="middle" class="h">SQLite · one file per project</text>
    <text x="1010" y="258" text-anchor="middle" class="t">WAL · FTS5 trigram · owner-only</text>
    <text x="1010" y="276" text-anchor="middle" class="m">~/BurpTracker/&lt;project&gt;.db</text>
  </g>

  <rect x="852" y="314" width="316" height="62" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="866" y="338" class="h">API Logging tab (EDT)</text>
  <text x="866" y="358" class="t">updates coalesced every 300 ms · paged log</text>

  <rect x="852" y="390" width="316" height="96" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="866" y="414" class="h">tracker-search</text>
  <text x="866" y="434" class="t">log pages · search (LIKE / FTS)</text>
  <text x="866" y="452" class="t">Copy log for AI · Export all →</text>
  <text x="866" y="470" class="t">Markdown: coverage, original req/resp, tests</text>

  <!-- arrows: burp → queues -->
  <path d="M274,149 C296,149 300,175 316,180" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M274,220 C294,220 300,200 316,196" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M274,240 C296,250 300,300 316,304" fill="none" stroke="#ec4899" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M274,305 C296,305 300,215 316,210" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M274,375 C300,375 300,222 316,216" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- queues → threads -->
  <line x1="440" y1="186" x2="472" y2="186" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="440" y1="306" x2="472" y2="306" stroke="#ec4899" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- history ↔ proxy history -->
  <path d="M472,440 C400,440 340,458 276,458" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#a)"/>
  <!-- threads → db -->
  <path d="M806,150 L850,150" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M806,300 C830,300 830,165 850,160" fill="none" stroke="#ec4899" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M806,410 C834,410 830,172 850,168" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- db → sqlite -->
  <line x1="1010" y1="180" x2="1010" y2="190" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- core → UI (bus) -->
  <path d="M806,232 C826,232 828,340 850,342" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- sqlite → search -->
  <path d="M1150,250 C1186,250 1186,430 1170,436" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- legend / footer -->
  <text x="32" y="530" class="t" font-weight="700">Never slows Burp down</text>
  <text x="32" y="550" class="t">• bounded queues: when full, events are dropped and counted, Burp never waits</text>
  <text x="32" y="568" class="t">• circuit breaker: a handler with &gt;1% of calls over 1 ms disables itself (re-enable from the tab)</text>
  <text x="32" y="586" class="t">• unload never blocks the UI thread; pending writes are flushed, the final Intruder row is written</text>
  <text x="640" y="550" class="t">• sends compressed against their original (a few dozen bytes each)</text>
  <text x="640" y="568" class="t">• originals loaded on demand, prepared statements cached</text>
  <text x="640" y="586" class="t">• the status bar shows every handler's average / max cost</text>
</svg>
