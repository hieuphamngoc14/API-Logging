<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .h { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 12.5px; fill: #334155; }
      .m { font-size: 10.5px; fill: #1e293b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .tag { font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="44" class="title">How API Logging fits into a test</text>
  <text x="32" y="68" class="sub">Every send is diffed against its original request, logged per API, and can be handed to an AI with full context.</text>

  <!-- 1. Proxy -->
  <rect x="32" y="96" width="200" height="300" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <circle cx="56" cy="122" r="13" fill="#f59e0b"/><text x="56" y="127" text-anchor="middle" class="n">1</text>
  <text x="78" y="127" class="h">Browse via Proxy</text>
  <rect x="48" y="146" width="168" height="112" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="48" y="146" width="168" height="22" rx="6" fill="#f1f5f9"/>
  <text x="56" y="161" class="m">Proxy · HTTP history</text>
  <rect x="49" y="171" width="166" height="20" fill="#fef08a"/>
  <text x="56" y="185" class="m">POST /login</text><text x="210" y="185" class="m" fill="#92400e" text-anchor="end">untested</text>
  <text x="56" y="207" class="m">GET  /orders/10452</text>
  <rect x="49" y="215" width="166" height="20" fill="#fef08a"/>
  <text x="56" y="229" class="m">GET  /cart</text><text x="210" y="229" class="m" fill="#92400e" text-anchor="end">untested</text>
  <text x="56" y="251" class="m">GET  /app.js</text>
  <text x="48" y="284" class="t">In-scope APIs you have not</text>
  <text x="48" y="302" class="t">tested yet are highlighted</text>
  <text x="48" y="320" class="t">yellow (Notes: untested).</text>
  <text x="48" y="348" class="t">Static files, OPTIONS and</text>
  <text x="48" y="366" class="t">out-of-scope hosts skipped.</text>

  <!-- 2. Send to Repeater -->
  <rect x="268" y="96" width="200" height="300" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <circle cx="292" cy="122" r="13" fill="#3b82f6"/><text x="292" y="127" text-anchor="middle" class="n">2</text>
  <text x="314" y="127" class="h">Send to Repeater</text>
  <text x="284" y="156" class="t">Ctrl+Alt+R or right-click →</text>
  <text x="284" y="174" class="t">Send to Repeater (tracked)</text>
  <rect x="284" y="190" width="168" height="26" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="292" y="207" class="m">POST /api/v2/auth/login</text>
  <text x="284" y="234" class="t">Tab = method + full path</text>
  <text x="284" y="252" class="t">(query dropped).</text>
  <rect x="284" y="270" width="168" height="48" rx="6" fill="#dbeafe"/>
  <text x="292" y="290" class="t" font-weight="700">#1 original request</text>
  <text x="292" y="308" class="t">request + response saved</text>
  <text x="284" y="344" class="t">Burp's own Ctrl+R works too</text>
  <text x="284" y="362" class="t">(tab hook, Proxy lookup).</text>

  <!-- 3. Test -->
  <rect x="504" y="96" width="200" height="300" rx="12" fill="#f8fafc" stroke="#64748b"/>
  <circle cx="528" cy="122" r="13" fill="#64748b"/><text x="528" y="127" text-anchor="middle" class="n">3</text>
  <text x="550" y="127" class="h">Test</text>
  <rect x="520" y="146" width="168" height="66" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="532" y="168" class="t" font-weight="700" fill="#1d4ed8">Repeater</text>
  <text x="532" y="186" class="t">edit and send as usual,</text>
  <text x="532" y="203" class="t">from any number of tabs</text>
  <rect x="520" y="222" width="168" height="74" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="532" y="244" class="t" font-weight="700" fill="#6d28d9">AI agent</text>
  <text x="532" y="262" class="t">curl through the Proxy</text>
  <text x="532" y="280" class="m">-H 'x-burp: claude'</text>
  <rect x="520" y="306" width="168" height="74" rx="8" fill="#ffffff" stroke="#f472b6"/>
  <text x="532" y="328" class="t" font-weight="700" fill="#be185d">Intruder</text>
  <text x="532" y="346" class="t">one row per attack:</text>
  <text x="532" y="364" class="t">§ positions + stats</text>

  <!-- 4. Log -->
  <rect x="740" y="96" width="200" height="300" rx="12" fill="#f0fdfa" stroke="#14b8a6"/>
  <circle cx="764" cy="122" r="13" fill="#14b8a6"/><text x="764" y="127" text-anchor="middle" class="n">4</text>
  <text x="786" y="127" class="h">Log per API</text>
  <rect x="756" y="146" width="168" height="150" rx="6" fill="#ffffff" stroke="#99f6e4"/>
  <text x="764" y="166" class="m">#1 original</text>
  <text x="764" y="188" class="m">#2 ~ body $.username</text>
  <text x="776" y="204" class="m" fill="#b45309">"alice" → "alice'--"</text>
  <text x="776" y="220" class="m" fill="#64748b">→ 500 · 1,204 B</text>
  <text x="764" y="242" class="m">#3 - header Authorization</text>
  <text x="776" y="258" class="m" fill="#64748b">→ 401 · 38 B</text>
  <text x="764" y="280" class="m">#4 § body $.password</text>
  <text x="756" y="322" class="t">Diffed vs the original:</text>
  <text x="756" y="340" class="t">~ modified  - removed  + added</text>
  <text x="756" y="366" class="t">First real change → tested,</text>
  <text x="756" y="384" class="t">yellow cleared in Proxy.</text>

  <!-- 5. AI -->
  <rect x="976" y="96" width="192" height="300" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <circle cx="1000" cy="122" r="13" fill="#8b5cf6"/><text x="1000" y="127" text-anchor="middle" class="n">5</text>
  <text x="1022" y="127" class="h">Hand to an AI</text>
  <text x="992" y="156" class="t">Copy log for AI · Export all</text>
  <text x="992" y="174" class="t">→ Markdown with:</text>
  <rect x="992" y="188" width="160" height="26" rx="6" fill="#ede9fe"/><text x="1002" y="205" class="t">What was tested</text>
  <rect x="992" y="220" width="160" height="26" rx="6" fill="#ede9fe"/><text x="1002" y="237" class="t">Never-modified fields</text>
  <rect x="992" y="252" width="160" height="26" rx="6" fill="#ede9fe"/><text x="1002" y="269" class="t">Original req + response</text>
  <rect x="992" y="284" width="160" height="26" rx="6" fill="#ede9fe"/><text x="1002" y="301" class="t">Every test, in order</text>
  <rect x="992" y="316" width="160" height="26" rx="6" fill="#ede9fe"/><text x="1002" y="333" class="t">Untested APIs left</text>
  <text x="992" y="370" class="t">Masked fields stay masked.</text>

  <!-- arrows -->
  <line x1="234" y1="246" x2="264" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="246" x2="500" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="706" y1="246" x2="736" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="942" y1="246" x2="972" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- loop back: AI proposes next tests -->
  <path d="M1072,398 L1072,470 L604,470 L604,402" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAi)"/>
  <rect x="694" y="456" width="290" height="28" rx="14" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="839" y="475" text-anchor="middle" class="t" fill="#6d28d9">AI reads the context, sends the next tests</text>
  <text x="32" y="530" class="sub">One SQLite file per Burp project · nothing runs on Burp's threads except a sub-microsecond hand-off.</text>
</svg>
